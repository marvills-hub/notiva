<aside class="sidebar" [class.collapsed]="collapsed()">
  <div class="sidebar-brand">
    <div class="brand-logo">
      <img src="assets/images/notiva-logo.png" alt="Notiva" />
    </div>
    <div class="brand-text">
      <strong>Notiva</strong>
      <span>Visual Notes</span>
    </div>
  </div>
  <nav class="sidebar-nav">
    <a routerLink="/notes" routerLinkActive="active" title="Notes">
      <i class="fa-regular fa-note-sticky"></i>
      <span>Notes</span>
    </a>
    <a routerLink="/boards" routerLinkActive="active" title="Boards">
      <i class="fa-solid fa-table-columns"></i>
      <span>Boards</span>
    </a>
    <a routerLink="/drawing-boards" routerLinkActive="active" title="Drawing Boards">
      <i class="fa-solid fa-pen-ruler"></i>
      <span>Drawing Boards</span>
    </a>
    <a routerLink="/favorites" routerLinkActive="active" title="Favorites">
      <i class="fa-regular fa-star"></i>
      <span>Favorites</span>
    </a>
    <a routerLink="/archive" routerLinkActive="active" title="Archive">
      <i class="fa-solid fa-box-archive"></i>
      <span>Archive</span>
    </a>
  </nav>
  <div class="sidebar-spacer"></div>
  <nav class="sidebar-nav bottom">
    <a routerLink="/settings" routerLinkActive="active" title="Settings">
      <i class="fa-solid fa-gear"></i>
      <span>Settings</span>
    </a>
  </nav>
</aside>
