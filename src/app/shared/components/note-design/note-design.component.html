<div
  class="note-design"
  [class.preview]="preview()"
  [attr.data-style]="style().id"
  [attr.data-pattern]="style().pattern"
  [attr.data-decoration]="style().decoration"
  [style.--note-bg]="style().background"
  [style.--note-text]="style().textColor"
  [style.--note-secondary]="style().secondaryTextColor"
  [style.--note-line]="style().lineColor"
  [style.--note-border]="style().borderColor"
  [style.--note-accent]="style().accentColor"
  [style.clip-path]="style().clipPath"
  [style.border-radius]="style().borderRadius"
>
  <div class="note-decoration"></div>

  @if (preview()) {
    <div class="preview-content">
      <span class="preview-title"></span>
      <span class="preview-line long"></span>
      <span class="preview-line"></span>
      <span class="preview-line short"></span>
    </div>
  } @else {
    <ng-content></ng-content>
  }
</div>
